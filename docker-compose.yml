
version: '3.8'

services:

  mysql-db:
    image: mysql:8.0
    container_name: mysql-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: class_bookings
    ports:
      - "3307:3306"          # 3307 on host so it doesn't clash with local MySQL
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  my-app:
    build:
      context: .
      dockerfile: Dockerfile   
    container_name: spring-app
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local
    depends_on:
      mysql-db:
        condition: service_healthy    # waits until MySQL is actually ready
    networks:
      - app-network

volumes:
  mysql-data:

networks:
  app-network:
    driver: bridge
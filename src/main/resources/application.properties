spring.application.name=ClassSync-GlobalMulti-TimezoneClassBookingSystem

spring.datasource.url=jdbc:mysql://localhost:3306/class_bookings?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true


spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:password}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
sql.init.mode=always
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=true

#spring.jackson.time-zone=UTC



server.port=8080

logging.level.com.classplatform=DEBUG
logging.level.org.springframework.web=INFO